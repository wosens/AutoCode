# AutoCode patch overlay for the upstream official SDK profile (dsh >= 0.1.2).
#
# Upstream removed packages/examples (jsonrpc-demo + dsh-agent-spine-demo) in
# dsh-v0.1.2 and made the JSON-RPC SDK official: `dsh --profile sdk` boots the
# sdk-app bundle (sdk-jsonrpc-server over dsh-base). AutoCode therefore starts
#   node apps/cli/lib/bin.js --profile sdk --patch <this file, absolute path>
# instead of the legacy `bin.js cordis.yml` pair. The wire protocol
# (initialize / session/prompt / session.event / session.status /
# subagent.*) is unchanged, so the runner needs no protocol work.
#
# Patch semantics (cordis-plugin-include): top-level YAML array; an `id` entry
# REPLACES the whole config of that row, `insert` adds rows. `!!js` must stay
# scalar-kind (quoted expression strings only - see v2.1.127 lessons).
# $DSH_HOME/settings.yaml `llm-pi-ai:` sections merge per provider ON TOP of
# this layer, so user-managed routes (glm-custom etc.) keep working.
#
# Version-managed master copy lives in the AutoCode repository at
# agent/dsh/sdk.autocode.patch.yml - edit there and sync to Execute/dsh/.

# Token-capped turns must surface as turn/end reason=max-tokens (AutoCode's
# auto-resume depends on it; the sdk-app default is `true` via env fallback).
- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: false

# AutoCode env-slot provider (2026.08.18 custom-model support, same shape as
# the legacy cordis.autocode.yml): EnsureProcess injects DSH_LLM_* and
# AUTOCODE_DSH_API_KEY from the user-managed custom model list; without a
# selection the ?? fallbacks keep a bare runtime usable. glm-custom stays in
# $DSH_HOME/settings.yaml (user-managed, hot-reloaded) - not duplicated here.
- id: llm-pi-ai
  config:
    providers:
      autocode-active:
        displayName: !!js process.env.DSH_LLM_NAME ?? 'AutoCode Active Model'
        apiKeyEnv: AUTOCODE_DSH_API_KEY
        api: !!js process.env.DSH_LLM_API ?? 'anthropic-messages'
        baseURL: !!js process.env.DSH_LLM_BASE_URL ?? 'http://10.1.0.201/claude'
        # 2026-10-20 中继 CC 门禁：内网两台中继（10.1.0.201 / 118.128:9000 同栈）按
        #   客户端特征限流，非 Claude Code CLI 特征一律 403 client_validation_error
        #   ("This endpoint only accepts requests from Claude Code CLI")。pi-ai 默认
        #   UA 是 "pi (...)"，必须在 provider 级 headers 覆盖（mergeClientHeaders 中
        #   model.headers 后置、可覆盖默认 UA；实测补头即 200）。
        headers:
          User-Agent: 'claude-cli/2.0.55 (external, cli)'
          x-app: 'cli'
        models:
          - id: !!js process.env.DSH_LLM_MODEL ?? 'glm-5.2'
            name: Active Model
            contextWindow: !!js Number(process.env.DSH_LLM_CTX ?? 131072)
            maxTokens: !!js Number(process.env.DSH_LLM_MAXTOK ?? 32768)
            # 2026.10.20 思考强度能力声明：hand-declared 模型缺省无 reasoning 能力，
            #   设置页思考强度(non-off)会在 initialize 被服务端以
            #   "does not support reasoning effort" 拒绝（-32603，AutoCode 只能
            #   去强度自愈续跑）。anthropic-messages 通道按档位映射 thinking
            #   budget，wire 值不逐字上行；openai 系通道则逐字发送。声明与
            #   设置页四档（off/low/high/max）对齐；off 留空 = 不发思考参数。
            reasoningEfforts:
              'off':
              low: low
              high: high
              max: max

# Persona + global context (legacy agent-spine persona equivalent): task-stage
# persona via DSH_SYSTEM_PROMPT fallback default, shared global rules
# (portable CLAUDE.md content) appended via DSH_GLOBAL_CONTEXT. Both env vars
# are optional; {{model}}/{{cwd}} template variables resolve inside dsh.
- id: system-prompt
  config:
    personaPrefix: !!js "(process.env.DSH_SYSTEM_PROMPT ?? 'You are a meticulous coding agent executing staged automation tasks. Follow the task instructions exactly and write the required output files before finishing.') + (process.env.DSH_GLOBAL_CONTEXT ? '\\n\\n' + process.env.DSH_GLOBAL_CONTEXT : '')"
    personaSuffix: 'Your working directory is {{cwd}}.'

# Portable skill roots (2026.08.24): EnsureProcess injects
# DSH_SKILLS_DIRS = <exe>\skills;<user home>\.claude\skills (';'-joined,
# existing entries only). Default roots stay enabled alongside.
- id: skill-filesystem
  config:
    includeDefaultRoots: true
    customSkillDirs: !!js "(process.env.DSH_SKILLS_DIRS ?? '').split(';').filter(Boolean)"

# Session logs stay inside the active project (legacy layout parity):
# <project>/.autodev/dsh-sessions via DSH_SESSION_ROOT; zstd frames otherwise.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# Compaction tuning aligned with the legacy composition (AutoCode's
# compress/resume flow was tuned against these ratios).
- id: compaction-basic
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
